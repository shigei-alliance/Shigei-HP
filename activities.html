<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Log | HUVAC Creative Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans JP', sans-serif;
        }
        .hero-gradient {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
    </style>
</head>
<body class="text-slate-800 bg-slate-50 antialiased">

    <!-- ナビゲーションバー -->
    <nav class="fixed w-full z-50 bg-white/90 backdrop-blur-sm border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex-shrink-0 flex items-center">
                    <a href="index.html" class="text-xl font-bold text-slate-900 flex items-center gap-2 hover:opacity-70 transition-opacity">
                        <div class="w-8 h-8 bg-slate-900 text-white flex items-center justify-center rounded-lg">
                            <span class="font-bold">H</span>
                        </div>
                        HUVAC
                    </a>
                </div>
                <div class="flex items-center gap-4">
                    <a href="index.html" class="text-sm font-medium text-slate-500 hover:text-slate-900 flex items-center gap-1 transition-colors">
                        <i data-lucide="home" class="w-4 h-4"></i> Home
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- ヘッダーエリア -->
    <header class="pt-32 pb-12 bg-white border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center md:text-left">
                <h1 class="text-3xl md:text-4xl font-bold text-slate-900 mb-4">Activity Log</h1>
                <p class="text-slate-600 max-w-2xl">
                    日々の創作活動、イベントの様子、制作過程のアーカイブ。
                </p>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ (Coming Soon表示) -->
    <main class="py-20 bg-slate-50 min-h-[60vh] flex items-center justify-center">
        <div class="max-w-xl mx-auto px-6 text-center">
            <div class="relative inline-block mb-8">
                <!-- 装飾的な背景 -->
                <div class="absolute inset-0 bg-blue-500/10 blur-3xl rounded-full"></div>
                
                <div class="relative bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
                    <div class="w-20 h-20 bg-slate-900 text-white rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg rotate-3">
                        <i data-lucide="clock" class="w-10 h-10 animate-pulse"></i>
                    </div>
                    
                    <h2 class="text-3xl font-black text-slate-900 mb-4 tracking-tighter">COMING SOON</h2>
                    
                    <div class="h-1 w-20 bg-blue-600 mx-auto mb-6 rounded-full"></div>
                    
                    <p class="text-slate-600 leading-relaxed mb-8">
                        現在、過去の活動データの移行およびギャラリーの構築を行っております。<br>
                        作品の制作過程やイベントの記録など、HUVACの熱量を伝えるコンテンツを準備中です。
                    </p>
                    
                    <a href="index.html" class="inline-flex items-center justify-center px-6 py-3 bg-slate-900 text-white font-bold rounded-xl hover:bg-slate-800 transition-all hover:scale-105 active:scale-95 shadow-md">
                        トップページへ戻る
                    </a>
                </div>
            </div>
            
            <div class="flex justify-center gap-4 text-slate-400">
                <div class="flex items-center gap-1 text-xs">
                    <i data-lucide="hammer" class="w-3 h-3"></i> Under Construction
                </div>
                <div class="flex items-center gap-1 text-xs">
                    <i data-lucide="refresh-cw" class="w-3 h-3"></i> 2025 Winter Update
                </div>
            </div>
        </div>
    </main>

    <!-- フッター -->
    <footer class="bg-slate-950 text-slate-400 py-12 border-t border-slate-900">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <div class="flex justify-center items-center gap-2 mb-6 text-white">
                <div class="w-6 h-6 bg-slate-800 text-white flex items-center justify-center rounded text-xs">H</div>
                <span class="font-bold text-lg">HUVAC</span>
            </div>
            <p class="text-xs text-slate-600">&copy; 2025 HUVAC. All rights reserved.</p>
        </div>
    </footer>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
